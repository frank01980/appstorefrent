<script>
let busy=false;const B=[...document.querySelectorAll('.btn')];
function run(){if(busy)return;
 if(B[0].classList.contains('open')){B.forEach(b=>b.classList.remove('open'));scrollTo(0,0);return}
 busy=true;B.forEach(b=>b.classList.add('loading'));const t0=performance.now(),D=3500;
 (function step(t){let k=(t-t0)/D;k=Math.min(1,k<.15?k*2:.3+(k-.15)*.82);
  B.forEach(b=>b.querySelector('.p').style.strokeDashoffset=106.8*(1-k));
  if(t-t0<D)requestAnimationFrame(step);else{B.forEach(b=>{b.classList.remove('loading');b.classList.add('open');b.querySelector('.p').style.strokeDashoffset=106.8});busy=false}})(t0);
}
B.forEach(b=>b.addEventListener('click',run));
</script></body></html>
